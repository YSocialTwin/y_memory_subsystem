[build-system]
requires = ["setuptools>=69", "wheel", "build>=1.2"]
build-backend = "setuptools.build_meta"

[project]
name = "yclient-memory"
dynamic = ["version"]
description = "Reusable memory subsystem for YClientReddit and YClient."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "YSocialTwin"}
]
maintainers = [
  {name = "YSocialTwin"}
]
keywords = [
  "agent-memory",
  "llm",
  "memory",
  "social-simulation",
  "ysocial",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/YSocialTwin/y_memory_subsystem"
Documentation = "https://github.com/YSocialTwin/y_memory_subsystem/tree/main/docs"
Repository = "https://github.com/YSocialTwin/y_memory_subsystem"
Issues = "https://github.com/YSocialTwin/y_memory_subsystem/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.6",
]
release = [
  "build>=1.2",
  "twine>=5.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "yclient_memory.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
